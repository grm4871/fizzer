# Map to detect bots and CLI tools for graceful degradation
map $http_user_agent $is_bot_or_cli {
    default 0;
    ~*curl 1;
    ~*wget 1;
    ~*lynx 1;
    ~*links 1;
    ~*httpie 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*duckduckbot 1;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
}

# 1. HTTP -> HTTPS Redirect for Staging
server {
    listen 80;
    listen [::]:80;
    server_name staging.netar.is api-staging.netar.is;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Staging Frontend - staging.netar.is
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.netar.is;

    # SSL - Separate certificate for staging.netar.is (with certbot -0001 suffix)
    ssl_certificate     /etc/letsencrypt/live/staging.netar.is-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.netar.is-0001/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Netdoc routes - only proxy bots/CLI to backend for OG meta tags
    # Browsers get proxied to Vite dev server for SPA experience
    location ~ ^/netdoc/[a-zA-Z0-9]+ {
        # If bot or CLI, proxy to backend for SSR/meta tags
        if ($is_bot_or_cli = 1) {
            rewrite ^ /bot-proxy$uri last;
        }
        # For browsers, proxy to Vite dev server
        proxy_pass http://localhost:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Internal location for bot/CLI proxy to backend
    location /bot-proxy/ {
        internal;
        rewrite ^/bot-proxy(/.*)$ $1 break;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to Vite dev server (on staging port 5174)
    location / {
        proxy_pass http://localhost:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Vite HMR
        proxy_read_timeout 86400;
    }

    # API routes proxy to staging backend
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io proxy for staging
    location /socket.io {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

# 3. Staging API - api-staging.netar.is
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-staging.netar.is;

    # SSL - Separate certificate for api-staging.netar.is
    ssl_certificate     /etc/letsencrypt/live/api-staging.netar.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.netar.is/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
