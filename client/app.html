<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/gem.svg" />
  <!-- interactive-widget=resizes-content: without this, edge-to-edge Android
       leaves a huge empty band between the composer and the soft keyboard. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Fizzer</title>

  <!-- Fonts are visual polish, not a startup dependency. Load the stylesheet
       asynchronously so a slow third-party origin cannot hold first paint. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Saira:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Saira:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>

  <!-- Version check script - always loaded fresh from server -->
  <script>
    window.__CASCADE_DISABLE_AUTO_REFRESH__ = false;
  </script>
  <script src="/version-check.js"></script>

</head>

<body>
<div id="root"></div>
  <!-- No perpetual rAF / mouse spotlight: dead --mx/--my writes forced
       style recalc every frame and made idle hover feel lagged. -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
