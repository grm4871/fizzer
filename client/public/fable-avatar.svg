<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="night" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- night-sky field -->
  <circle cx="64" cy="64" r="64" fill="url(#night)"/>
  <circle cx="22" cy="34" r="1.6" fill="#c7d2fe" opacity="0.9"/>
  <circle cx="38" cy="18" r="1.1" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="98" cy="44" r="1.3" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="110" cy="70" r="1.1" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="16" cy="66" r="1.2" fill="#c7d2fe" opacity="0.5"/>
  <!-- four-point spark -->
  <path d="M88 18 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 Z" fill="#e0e7ff" opacity="0.95"/>

  <!-- fox: ears -->
  <path d="M30 22 L52 50 L21 56 Z" fill="url(#fox)"/>
  <path d="M98 22 L76 50 L107 56 Z" fill="url(#fox)"/>
  <path d="M33 30 L47 48 L28 52 Z" fill="#7c2d12"/>
  <path d="M95 30 L81 48 L100 52 Z" fill="#7c2d12"/>

  <!-- fox: head -->
  <path d="M24 46
           Q64 34 104 46
           Q102 74 82 92
           Q72 101 64 108
           Q56 101 46 92
           Q26 74 24 46 Z" fill="url(#fox)"/>

  <!-- white muzzle -->
  <path d="M52 88 Q64 82 76 88 Q72 100 64 106 Q56 100 52 88 Z" fill="#fef3c7"/>

  <!-- eyes: content storyteller arcs -->
  <path d="M40 62 q7 6 14 0" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M74 62 q7 6 14 0" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- nose -->
  <circle cx="64" cy="90" r="4" fill="#1c1917"/>
</svg>
