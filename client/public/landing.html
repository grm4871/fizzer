<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/gem.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fizzer</title>
  <meta name="description" content="Fizzer is a shared workspace for people and their AI agents." />
  <meta property="og:title" content="Fizzer" />
  <meta property="og:description" content="People, notes, chat, and agents in one shared workspace." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
  <script>
    try { if (location.pathname === '/' && localStorage.getItem('docs_token')) location.replace('/app'); }
    catch (e) { /* private mode / storage blocked */ }
  </script>
  <style>
    :root {
      --ink: hsl(22, 9%, 5%); --surface: hsl(22, 7%, 8%); --raised: hsl(22, 8%, 12%);
      --line: hsl(25, 8%, 18%); --paper: hsl(35, 14%, 89%); --muted: hsl(30, 7%, 60%);
      --amber: hsl(33, 68%, 52%); --amber-bright: hsl(33, 74%, 64%);
      --opus: hsl(288, 30%, 68%); --luna: hsl(214, 46%, 66%); --hermes: hsl(146, 38%, 60%);
      --shadow: 0 24px 60px -24px rgba(0,0,0,.75);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--paper); background: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 15% 15%, hsla(33,68%,52%,.1), transparent 35%), radial-gradient(circle at 85% 20%, hsla(288,30%,68%,.08), transparent 32%), linear-gradient(rgba(255,255,255,.008) 1px, transparent 1px), linear-gradient(90deg,rgba(255,255,255,.008) 1px,transparent 1px); background-size: auto,auto,40px 40px,40px 40px; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .page { width: min(1180px, calc(100% - 48px)); margin: auto; position: relative; }
    nav { height: 88px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 13px; text-decoration: none; font-family: 'Shippori Mincho', serif; font-size: 25px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .brand img { width: 39px; height: 39px; }
    .icon-button { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); transition: .2s ease; }
    .icon-button:hover { border-color: var(--amber); color: var(--amber-bright); transform: translateY(-2px); }
    .icon-button svg { width: 21px; height: 21px; }
    .hero { min-height: calc(100vh - 88px); display: grid; place-items: center; padding: 30px 0 72px; }
    .deco-stage { width: min(100%, 940px); aspect-ratio: 16/10; min-height: 540px; position: relative; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 28px; background: linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.012)); box-shadow: var(--shadow); isolation: isolate; }
    .deco-stage::before,.deco-stage::after { content: ''; position: absolute; inset: 24px; border: 1px solid rgba(224,157,59,.36); clip-path: polygon(0 0,42% 0,50% 8%,58% 0,100% 0,100% 42%,92% 50%,100% 58%,100% 100%,58% 100%,50% 92%,42% 100%,0 100%,0 58%,8% 50%,0 42%); }
    .deco-stage::after { inset: 38px; border-color: rgba(224,157,59,.15); }
    .sunburst { position: absolute; width: 76%; aspect-ratio: 1; border-radius: 50%; opacity: .24; background: repeating-conic-gradient(from -5deg,var(--amber) 0deg 1deg,transparent 1deg 14deg); mask-image: radial-gradient(circle,transparent 0 26%,#000 27% 49%,transparent 50%); }
    .constellation { width: 72%; height: 64%; position: relative; display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: center; z-index: 2; }
    .rail { height: 2px; background: linear-gradient(90deg,var(--amber),rgba(224,157,59,.15),var(--amber)); position: relative; }
    .rail::after { content:''; position:absolute; width:9px; height:9px; border:2px solid var(--amber); background:var(--surface); transform:rotate(45deg); left:calc(50% - 5px); top:-5px; animation:pulse 2.6s ease-in-out infinite; }
    .figure { display: grid; place-items: center; gap: 18px; }
    .figure-orbit { width: clamp(108px,15vw,164px); aspect-ratio:1; display:grid; place-items:center; position:relative; border:1px solid rgba(224,157,59,.4); border-radius:50%; }
    .figure-orbit::before,.figure-orbit::after { content:''; position:absolute; inset:12%; border:1px solid rgba(224,157,59,.2); transform:rotate(45deg); }
    .figure-orbit::after { inset:28%; background:var(--raised); border-color:var(--amber); }
    .person { width:52%; z-index:1; color:var(--paper); }
    .agent .figure-orbit { border-color:rgba(180,139,190,.55); }
    .agent .figure-orbit::after { border-color:var(--opus); border-radius:50%; }
    .agent .person { color:var(--opus); }
    .workspace { width: clamp(150px,20vw,220px); aspect-ratio: 1; display:grid; place-items:center; position:relative; transform:rotate(45deg); border:1px solid var(--amber); background:rgba(224,157,59,.04); }
    .workspace::before,.workspace::after { content:''; position:absolute; inset:11%; border:1px solid rgba(224,157,59,.32); }
    .workspace::after { inset:25%; background:var(--surface); box-shadow:0 0 45px rgba(224,157,59,.16); }
    .workspace img { width:46%; transform:rotate(-45deg); z-index:2; }
    .signals { position:absolute; inset:0; pointer-events:none; }
    .signal { position:absolute; width:10px; height:10px; border-radius:50%; box-shadow:0 0 18px currentColor; animation:drift 4s ease-in-out infinite; }
    .signal:nth-child(1){left:15%;top:24%;color:var(--luna)} .signal:nth-child(2){right:16%;top:25%;color:var(--opus);animation-delay:-1.3s}.signal:nth-child(3){left:23%;bottom:19%;color:var(--hermes);animation-delay:-2.2s}.signal:nth-child(4){right:24%;bottom:18%;color:var(--amber);animation-delay:-3s}
    .actions { position:absolute; bottom:52px; display:flex; gap:14px; z-index:4; }
    .action { width:58px;height:58px;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line);background:rgba(9,8,7,.8);backdrop-filter:blur(14px);text-decoration:none;transition:.2s ease; }
    .action:hover { border-color:var(--amber);color:var(--amber-bright);transform:translateY(-3px);box-shadow:0 10px 28px -12px rgba(224,157,59,.5); }
    .action.primary { color:var(--ink); background:linear-gradient(135deg,var(--amber),var(--amber-bright));border-color:transparent; }
    .action svg { width:23px;height:23px; }
    .platform-strip { padding: 72px 0 110px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .platform-strip .action { width:100%;height:104px;border-radius:18px; }
    footer { border-top:1px solid var(--line); min-height:110px; display:flex;align-items:center;justify-content:space-between;color:var(--muted); }
    .deco-rule { height:1px; flex:1; max-width:240px; background:linear-gradient(90deg,transparent,var(--amber)); }
    footer .deco-rule:last-child { transform:scaleX(-1); }
    @keyframes pulse { 50%{transform:rotate(45deg) scale(1.5);box-shadow:0 0 15px var(--amber)} }
    @keyframes drift { 50%{transform:translateY(-10px);opacity:.45} }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
    @media(max-width:760px){.page{width:min(100% - 24px,1180px)}.brand{font-size:20px}.hero{padding-top:10px}.deco-stage{aspect-ratio:auto;min-height:600px}.constellation{width:70%;height:72%;grid-template-columns:1fr;grid-template-rows:1fr 40px 1fr 40px 1fr}.rail{transform:rotate(90deg)}.figure-orbit{width:104px}.workspace{width:125px}.actions{bottom:30px}.platform-strip{grid-template-columns:1fr 1fr;padding:48px 0 72px}.platform-strip .action{height:76px}}
  </style>
</head>
<body>
  <div class="page">
    <nav>
      <a class="brand" href="/" aria-label="Fizzer home"><img src="/gem.svg" alt="">Fizzer</a>
      <a class="icon-button" href="/app" aria-label="Open Fizzer in browser" title="Open in browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5H5v14h14v-3M12 4h8v8M20 4l-9 9"/></svg></a>
    </nav>
    <main>
      <h1 class="sr-only">Fizzer — a shared workspace for people and AI agents</h1>
      <section class="hero" aria-label="People and agents working together in Fizzer">
        <div class="deco-stage">
          <div class="sunburst"></div>
          <div class="signals"><i class="signal"></i><i class="signal"></i><i class="signal"></i><i class="signal"></i></div>
          <div class="constellation" aria-hidden="true">
            <div class="figure human"><div class="figure-orbit"><svg class="person" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><circle cx="32" cy="20" r="9"/><path d="M15 53c2-13 9-20 17-20s15 7 17 20M10 53h44"/></svg></div></div>
            <div class="rail"></div>
            <div class="workspace"><img src="/gem.svg" alt=""></div>
            <div class="rail"></div>
            <div class="figure agent"><div class="figure-orbit"><svg class="person" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 16h28l7 16-7 16H18l-7-16 7-16Z"/><circle cx="25" cy="31" r="2" fill="currentColor"/><circle cx="39" cy="31" r="2" fill="currentColor"/><path d="M25 39h14M32 9v7"/></svg></div></div>
          </div>
          <div class="actions">
            <a class="action primary" id="primaryDownload" href="#download" aria-label="Download Fizzer" title="Download Fizzer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg></a>
            <a class="action" href="/app" aria-label="Open Fizzer in browser" title="Open in browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 6.5h.01"/></svg></a>
          </div>
        </div>
      </section>
      <section class="platform-strip" id="download" aria-label="Download Fizzer">
        <a class="action dl" href="/download/mac" data-platform="mac" aria-label="Download for macOS" title="macOS"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2c.1 1.1-.3 2.2-1 3-.7.8-1.8 1.4-2.9 1.3-.1-1 .4-2.1 1-2.8.7-.8 1.9-1.4 2.9-1.5zM20 17.4c-.5 1.2-.8 1.7-1.5 2.7-1 1.5-2.4 3.3-4.1 3.3-1.5 0-1.9-1-4-1-2 0-2.5 1-4 1-1.7 0-3-1.7-4-3.1-2.7-4-3-8.6-1.3-11.1 1.2-1.7 3-2.7 4.8-2.7 1.8 0 2.9 1 4.4 1 1.4 0 2.3-1 4.4-1 1.6 0 3.2.9 4.4 2.3-3.8 2.1-3.2 7.5.9 8.6z"/></svg></a>
        <a class="action dl" href="/download/windows" data-platform="windows" aria-label="Download for Windows" title="Windows"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.7 10.4 4.7v7.1H3zM3 12.2h7.4v7.1L3 18.3zM11.3 4.6 21 3.3v8.5h-9.7zM11.3 12.2H21v8.5l-9.7-1.3z"/></svg></a>
        <a class="action dl" href="/download/linux" data-platform="linux" aria-label="Download for Linux" title="Linux"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c-3 0-4 3-4 6 0 2-3 5-3 8 0 2 2 4 7 4s7-2 7-4c0-3-3-6-3-8 0-3-1-6-4-6Z"/><circle cx="10" cy="9" r=".7" fill="currentColor"/><circle cx="14" cy="9" r=".7" fill="currentColor"/><path d="m9 14 3 2 3-2"/></svg></a>
        <a class="action" href="/app" aria-label="Use Fizzer in browser" title="Browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9Z"/></svg></a>
      </section>
    </main>
    <footer aria-label="Fizzer"><div class="deco-rule"></div><a class="brand" href="/"><img src="/gem.svg" alt=""><span class="sr-only">Fizzer</span></a><div class="deco-rule"></div></footer>
  </div>
  <script>
    (function(){
      var ua=navigator.userAgent.toLowerCase(), platform=null;
      if(ua.includes('mac')) platform='mac'; else if(ua.includes('win')) platform='windows'; else if(ua.includes('linux')) platform='linux';
      var primary=document.getElementById('primaryDownload'); if(platform) primary.href='/download/'+platform;
    })();
  </script>
</body>
</html>
