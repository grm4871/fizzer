name: Bug report
description: Report a reproducible problem in Fizzer
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private workspace content, or security vulnerabilities. Report vulnerabilities through the Security tab.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fizzer version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop
        - Web
        - Android
        - Server / self-hosting
        - Agent runtime
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, agent CLI and version, browser, and any other relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, local paths, private messages, and workspace data.
