name: Desktop builds

# Builds the Cascade desktop app (a thin Electron shell that loads cscd.online)
# on each target OS. Native installer formats still require their target OS,
# which is why this runs a matrix on native runners.
#
# Each master build refreshes the technical-beta installers. They are published
# to both the rolling GitHub release and the production download volume.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-beta-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    defaults:
      run:
        working-directory: cascade-electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build local agent runtime
        working-directory: .
        run: |
          npx --yes npm@11.16.0 ci --ignore-scripts
          npx --yes npm@11.16.0 run build

      - name: Install dependencies
        # npm 11.16 records optional peers more strictly than earlier npm 11
        # releases. Pin the lockfile consumer so hosted-runner updates cannot
        # silently change clean-install behavior.
        run: npx --yes npm@11.16.0 ci

      - name: Make distributables
        run: npx electron-forge make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify packaged runtime
        run: node ../scripts/verify-desktop-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # These artifacts only hand the installers to the publish job; the
      # durable copies live on the rolling release and the production host.
      # ~2GB per run against a 500MB account quota, so expire them fast.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cascade-${{ matrix.platform }}-${{ matrix.arch }}
          path: cascade-electron/out/make/**/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish technical-beta installers
    needs: build
    runs-on: ubuntu-latest
    # This job consumes artifacts without checking out the repository, so gh
    # cannot infer its target from a local Git remote.
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: cascade-*
          path: artifacts

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          copy_asset() {
            local source_dir="$1" pattern="$2" destination="$3"
            local source
            source="$(find "$source_dir" -type f -name "$pattern" -print -quit)"
            test -n "$source"
            cp "$source" "release/$destination"
          }
          copy_asset artifacts/cascade-darwin-arm64 '*.dmg' Fizzer-mac-arm64.dmg
          copy_asset artifacts/cascade-darwin-x64 '*.dmg' Fizzer-mac-x64.dmg
          copy_asset artifacts/cascade-win32-x64 '*Setup*.exe' Fizzer-Setup.exe
          copy_asset artifacts/cascade-linux-x64 '*.deb' Fizzer-linux-x64.deb
          copy_asset artifacts/cascade-linux-x64 '*.rpm' Fizzer-linux-x64.rpm
          ls -lh release

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view desktop-beta >/dev/null 2>&1; then
            gh release create desktop-beta --title "Fizzer Desktop Beta" --notes "Current unsigned technical-beta installers for macOS, Windows, and Linux."
          fi
          gh release upload desktop-beta release/* --clobber

      - name: Attach installers to a versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

      - name: Place installers on production host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}"
          test -n "${DEPLOY_USER:-}"
          test -n "${DEPLOY_SSH_KEY:-}"
          test -n "${DEPLOY_KNOWN_HOSTS:-}"
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          LOOKUP="$DEPLOY_HOST"
          [[ "$PORT" == "22" ]] || LOOKUP="[$DEPLOY_HOST]:$PORT"
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p /var/lib/cascade/downloads'
          scp -i ~/.ssh/deploy_key -P "$PORT" release/* \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/cascade/downloads/"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test -s /var/lib/cascade/downloads/Fizzer-mac-arm64.dmg && test -s /var/lib/cascade/downloads/Fizzer-mac-x64.dmg && test -s /var/lib/cascade/downloads/Fizzer-Setup.exe && test -s /var/lib/cascade/downloads/Fizzer-linux-x64.deb && test -s /var/lib/cascade/downloads/Fizzer-linux-x64.rpm'
