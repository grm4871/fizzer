name: Desktop builds

# Builds the Cascade desktop app (a thin Electron shell that loads cscd.online)
# on each target OS. Native installer formats still require their target OS,
# which is why this runs a matrix on native runners.
#
# Trigger by pushing a tag (v*) to cut a release, or run manually from the
# Actions tab to produce downloadable artifacts without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    defaults:
      run:
        working-directory: cascade-electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build local agent runtime
        working-directory: .
        run: |
          npx --yes npm@11.16.0 ci --ignore-scripts
          npx --yes npm@11.16.0 run build

      - name: Install dependencies
        # npm 11.16 records optional peers more strictly than earlier npm 11
        # releases. Pin the lockfile consumer so hosted-runner updates cannot
        # silently change clean-install behavior.
        run: npx --yes npm@11.16.0 ci

      - name: Make distributables
        run: npx electron-forge make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify packaged runtime
        run: node ../scripts/verify-desktop-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # Keep every run's output downloadable from the run page, tag or not.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cascade-${{ matrix.platform }}-${{ matrix.arch }}
          path: cascade-electron/out/make/**/*
          if-no-files-found: error

      # On a tag, attach the installers/zips to the GitHub Release.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cascade-electron/out/make/**/*
          fail_on_unmatched_files: true
