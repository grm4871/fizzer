name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -H -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Cascade Dev sideload APK lives on the host data volume (mounted at /data),
      # not in the Docker image. Keep deploys slim; phones hit /download/android
      # which serves /var/lib/cascade/cascade-android.apk.
      - name: Place Cascade Dev APK on host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          if ! gh release download android-dev -p cascade-android.apk -R "${{ github.repository }}" -O /tmp/cascade-android.apk; then
            echo "No android-dev release asset yet — skipping APK publish (download will 404 until one exists)."
            exit 0
          fi
          ls -la /tmp/cascade-android.apk
          ssh -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p /var/lib/cascade'
          scp -P "$PORT" /tmp/cascade-android.apk "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/cascade/cascade-android.apk"
          ssh -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" 'ls -la /var/lib/cascade/cascade-android.apk'

      - name: Deploy production on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/cascade-browser

          # Serialize the entire sync/build/swap sequence on the host.
          exec {DEPLOY_LOCK_FD}<"$PWD"
          echo "==> Waiting for production deploy lock (up to 900s)"
          flock -w 900 "$DEPLOY_LOCK_FD"
          export CASCADE_DEPLOY_LOCK_HELD=1

          echo "==> Syncing code (master)"
          git fetch origin master
          git reset --hard origin/master

          bash deploy/remote-update.sh
          REMOTE
