version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netaris-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: netaris
      POSTGRES_USER: netaris
      POSTGRES_PASSWORD: netaris_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/perms.sql:/docker-entrypoint-initdb.d/01-perms.sql:ro
      - ./init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./sql/perms_triggers.sql:/docker-entrypoint-initdb.d/03-perms_triggers.sql:ro
      - ./sql/jacket.sql:/docker-entrypoint-initdb.d/04-jacket.sql:ro
      - ./sql/reacts.sql:/docker-entrypoint-initdb.d/05-reacts.sql:ro
      - ./sql/create.sql:/docker-entrypoint-initdb.d/06-create.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/07-seed.sql:ro
      - ./onboarding.md:/docker-entrypoint-initdb.d/onboarding.md:ro
      - ./init-onboarding.bat:/docker-entrypoint-initdb.d/99-init-onboarding.bat:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netaris -d netaris"]
      interval: 10s
      timeout: 5s
      retries: 5

  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: netaris-ergo
    restart: unless-stopped
    ports:
      - "6667:6667"
      - "6697:6697"
    volumes:
      - ./ircd.yaml:/ircd/ircd.yaml:ro
      - ergo_data:/ircd/db

  # Runs Prisma db push after PostgreSQL is ready to sync any Prisma-only schema changes
  db-init:
    image: node:20-alpine
    container_name: netaris-db-init
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://netaris:netaris_dev_password@postgres:5432/netaris
    volumes:
      - .:/app
    command: sh -c "npm install prisma @prisma/client --silent && npx prisma db pull && npx prisma db push --accept-data-loss --skip-generate"
    # Run once and exit
    restart: "no"

volumes:
  postgres_data:
  ergo_data:
