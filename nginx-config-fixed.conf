# Map to detect bots and CLI tools for graceful degradation
map $http_user_agent $is_bot_or_cli {
    default 0;
    ~*curl 1;
    ~*wget 1;
    ~*lynx 1;
    ~*links 1;
    ~*httpie 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*duckduckbot 1;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
}

# HTTP → HTTPS redirect + ACME challenge for Certbot
server {
    if ($host = api.netar.is) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = netar.is) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name netar.is api.netar.is;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main site — production Vite build (static files)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netar.is;

    root /var/www/netar.is;      # ← points to your dist folder
    index index.html;

    # Let's Encrypt paths (Certbot already added these)
    ssl_certificate     /etc/letsencrypt/live/netar.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netar.is/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Graceful degradation: proxy /netdoc/:id to backend for bots/CLI
    # Note: IDs are alphanumeric (base-32), not just numeric
    location ~ ^/netdoc/[a-zA-Z0-9]+ {
        # Use error_page trick to conditionally proxy
        # When $is_bot_or_cli=1, return 418 (unused code) and handle it with proxy
        if ($is_bot_or_cli = 1) {
            rewrite ^ /bot-proxy$uri last;
        }
        # For browsers, serve the SPA
        try_files $uri /index.html;
    }

    # Internal location for bot/CLI proxy
    location /bot-proxy/ {
        internal;
        rewrite ^/bot-proxy(/.*)$ $1 break;
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;   # ← crucial for client-side routing (React/Vue/Svelte etc.)
    }

    # Optional: longer cache for assets with hashes in filename
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API subdomain - with WebSocket support
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.netar.is;
    
    ssl_certificate /etc/letsencrypt/live/netar.is/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/netar.is/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase timeouts for long-lived connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support - CRITICAL for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        
        # Don't cache WebSocket connections
        proxy_cache_bypass $http_upgrade;
    }
}
