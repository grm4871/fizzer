map $http_user_agent $is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*duckduckbot 1;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*curl 1;
    ~*wget 1;
    ~*lynx 1;
    ~*httpie 1;
    ~*chatgpt 1;
    ~*gptbot 1;
    ~*claude 1;
    ~*anthropic 1;
    ~*perplexity 1;
    ~*openai 1;
    ~*amazonbot 1;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name netar.is api.netar.is;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://netar.is$request_uri;
    }
}

# Main Application
server {
    listen 443 ssl http2;
    server_name netar.is;
    root /var/www/netar.is;
    index app.html;
    
    ssl_certificate         /etc/letsencrypt/live/netar.is/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/netar.is/privkey.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    # Assets - Cache Long Term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API Proxy
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # CRITICAL FIX: Forward Client IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Netdoc routes - serve SSR for bots, SPA for browsers
    location ~ ^/netdoc/ {
        if ($is_bot) {
            proxy_pass http://localhost:3000;
        }
        try_files $uri $uri/ /app.html;
    }

    # SPA Fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /app.html;
    }
}

# Dedicated API Block
server {
    listen 443 ssl http2;
    server_name api.netar.is;
    
    ssl_certificate     /etc/letsencrypt/live/netar.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netar.is/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # CRITICAL FIX: Forward Client IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors off;
    }
}
